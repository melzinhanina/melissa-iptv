name: Hostless compatibility tests

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies
        run: |
          npm install --no-audit --no-fund
          npm install-scripts approve ffmpeg-static
      - name: Run regression tests
        run: node --test
      - name: Verify FFmpeg binary
        run: node --input-type=module -e 'import { checkFfmpeg } from "./hls.js"; console.log(await checkFfmpeg())'
      - name: Check JavaScript syntax
        run: |
          node --check start.js
          node --check server.js
          node --check extractor.js
          node --check hls.js
          node --check storage-paths.js
